name: Min TV distribution checks

# Read-only synthetic tests: never dispatch signing/distribution or upload an installer.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/signing/**'
      - 'tools/tests/**'
      - 'config/mintv-signing.json'
      - 'app/src/test/resources/updates/**'
      - '.github/workflows/mintv-*.yml'
  push:
    branches: [main]
    paths:
      - 'tools/signing/**'
      - 'tools/tests/**'
      - 'config/mintv-signing.json'
      - 'app/src/test/resources/updates/**'
      - '.github/workflows/mintv-*.yml'

permissions:
  contents: read

jobs:
  distribution-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m unittest discover -s tools/tests -v
