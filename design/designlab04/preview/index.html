function vodCard(item,id){return button(id,'card',`<div class="art">${art(item.kind)}</div><span class="card-label">${esc(item.title)}</span><span class="card-sub">${esc(item.meta)}</span>`,()=>detail(item));}
function library(){let s=title('Film & serier','Något att stanna kvar i.','DIN SAMLING');s+='<p class="top-note">Filmer och serier har varsin egen ingång. Båda finns alltid här.</p>';[movies,series].forEach((data,group)=>{const prefix=group?'series':'movies';s+='<div class="vod-row vod">'+button('vod-'+prefix,'entry-tile',`<span class="entry-icon">${group?'▤':'▰'}</span><strong>${group?'Serier':'Filmer'}</strong><span>Utforska ${group?'serier':'filmer'} &nbsp;→</span>`,()=>catalog(group))+data.map((item,i)=>vodCard(item,'vod-'+prefix+i)).join('')+'</div>';addRow(group?'serier':'filmer',['vod-'+prefix,...data.map((_,i)=>'vod-'+prefix+i)]);});s+=section('Fortsätt titta',state.resume?'Där du lämnade berättelsen':'Ingen påbörjad film eller serie');if(state.resume){s+='<div class="row three">'+resumes.map((x,i)=>resumeCard(x,'vod-resume'+i)).join('')+'</div>';addRow('fortsätt',[0,1,2].map(i=>'vod-resume'+i));}else s+='<div class="empty"><b>En tom rad, inte en återvändsgränd.</b> Utforska Filmer eller Serier ovan för att börja.</div>';return s;}
function profile(){let s=title('Din profil','Personligt, enkelt och avskilt.','ENDAST DEMODATA');s+='<div class="profile-layout"><div class="profile-box"><h2>Vem tittar?</h2>'+['Jonas','Familj'].map((p,i)=>button('profile-'+i,'profile-choice',`<span class="avatar">${p[0]}</span><span><strong>${p}</strong><small>${i?'En egen designprofil':'Din personliga kväll'}</small></span>${state.profile===p?'<span class="profile-chosen">Aktiv</span>':''}`,()=>{state.profile=p;state.mem={};state.scroll={};render('profile-'+i);toast('Designprofil: '+p+' · inga riktiga data ändras');})).join('')+'</div><div class="profile-box"><div class="eyebrow">DITT FAVORITLAG</div><div class="crest">'+(state.team==="Brynäs"?"BIF":"FHC")+'<small>'+state.team.toUpperCase()+'</small></div><h2>'+state.team+'</h2><p>Ditt lag lyfter matchkvällen till Hem.<br>Lagvalet ändras endast i labbets scenarier. Inga riktiga profilinställningar läses.</p></div></div>';addRow('profiler',['profile-0']);addRow('profiler',['profile-1']);return s;}
function header(){return `<div class="brand">${playIcon}Min TV</div><nav aria-label="Huvudnavigation">${navs.map((n,i)=>button('nav'+i,'nav-item '+(state.page===i?'active':''),i===4?`<span class="avatar">${state.profile[0]}</span>${n}`:n,()=>activateNav(i,false),n)).join('')}</nav><div class="clock">${isLive()?'19:42':'18:42'}</div>`;}
function render(wanted){const scroll=$('screen').scrollTop;actions={};rows=[];serial=0;$('header').innerHTML=header();$('screen').dataset.page=state.page;$('screen').innerHTML=[home,tv,sport,library,profile][state.page]();$('screen').scrollTop=state.scroll[state.page]??0;renderModal();focus(wanted||state.focus||firstContent(),false);fit();}
function firstContent(){return rows[0]?.ids[0]||'nav'+state.page;}
function currentRows(){return state.stack.length?modalRows:[{section:'huvudnavigation',ids:navs.map((_,i)=>'nav'+i)},...rows];}
function focus(id,updateLane=true){const table=currentRows();let row=table.find(r=>r.ids.includes(id));if(!row){id=state.stack.length?table[table.length-1]?.ids[0]:firstContent();row=table.find(r=>r.ids.includes(id));}const el=$(id);if(!el)return;document.querySelectorAll('.is-focus').forEach(e=>e.classList.remove('is-focus'));el.classList.add('is-focus');state.focus=id;if(updateLane&&row){let c=row.ids.indexOf(id);state.lane=c;}el.focus({preventScroll:true});if(!id.startsWith('nav'))el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});if(!state.stack.length&&!id.startsWith('nav')){state.mem[state.page]=id;state.scroll[state.page]=$('screen').scrollTop;}debug();}
function activateNav(page,enter){if(!state.focus.startsWith('nav'))state.mem[state.page]=state.focus;state.scroll[state.page]=$('screen').scrollTop;state.page=page;state.stack=[];state.focus=enter?(state.mem[page]||''):'nav'+page;state.lane=0;render(state.focus||undefined);if(enter)focus(state.focus,true);}
function move(key){const table=currentRows();let ri=table.findIndex(r=>r.ids.includes(state.focus));if(ri<0){focus(firstContent());return;}const row=table[ri],ci=row.ids.indexOf(state.focus);if(!state.stack.length&&ri===0){if(key==='ArrowDown'){activateNav(ci,true);return;}if(key==='ArrowUp')return;}
if(key==='ArrowLeft'||key==='ArrowRight'){const next=ci+(key==='ArrowRight'?1:-1);if(next>=0&&next<row.ids.length)focus(row.ids[next]);return;}
const nextRow=ri+(key==='ArrowDown'?1:-1);if(nextRow<0||nextRow>=table.length)return;if(!state.stack.length&&nextRow===0){focus('nav'+state.page);return;}const target=table[nextRow];focus(target.ids[Math.min(target.ids.length-1,state.lane)],false);}
function push(kind,payload){state.stack.push({kind,payload,origin:state.focus,lane:state.lane});renderModal();focus(modalRows[modalRows.length-1]?.ids[0],true);}
function detail(item){push('detail',item);}function play(item){state.paused=false;push('player',item);}function manual(){push('manual',{});}function catalog(group){push('catalog',{group});}
function back(){if(state.stack.length){const popped=state.stack.pop();renderModal();state.lane=popped.lane;focus(popped.origin,false);return;}if(!state.focus.startsWith('nav')){state.mem[state.page]=state.focus;focus('nav'+state.page);return;}if(state.page!==0){activateNav(0,false);return;}toast('Du är på Hem · prototypen avslutas inte.');}
function renderModal(){modalRows=[];const modal=$('modal'),top=state.stack.at(-1);$('screen').inert=!!top;$('header').inert=!!top;if(!top){modal.innerHTML='';return;}const item=top.payload;const close=button('modal-back','secondary','← Tillbaka',back);let content='';if(top.kind==='player'){content=`<div class="player" role="dialog" aria-modal="true" aria-label="Simulerad spelare"><div class="player-art">${art(item.kind)}</div><div class="player-top"><span>MIN TV · SIMULERAD UPPSPELNING</span>${close}</div><div class="player-center"><div class="play-circle">▷</div><span>Designförhandsvisning · ingen video eller anslutning startas</span></div><div class="player-bottom"><div class="player-caption ${item.manual?'unverified':''}">${item.manual?'MANUELLT KANALVAL · SÄNDNING EJ BEKRÄFTAD':'ENDAST SYNTHETISK DESIGNFIXTUR'}</div><h2>${esc(item.title)}</h2><p>${esc(item.meta||'Exempelinnehåll för navigationsgranskning')}</p><div class="timeline"><i></i></div><div class="actions">${button('player-pause','primary',state.paused?'▷ Fortsätt':'Ⅱ Pausa',()=>{state.paused=!state.paused;renderModal();focus('player-pause');})}${button('player-subs','secondary','Undertext: '+(state.subtitle?'Svenska':'Av'),()=>{state.subtitle=!state.subtitle;renderModal();focus('player-subs');toast('Simulerat undertextval · ingen undertextmotor körs');})}</div></div></div>`;modalRows=[{section:'spelare tillbaka',ids:['modal-back']},{section:'spelarkontroller',ids:['player-pause','player-subs']}];}
else if(top.kind==='channel'){const c=channels[item.index],valid=state.epg&&state.epgMode!=='stale'&&!!c[2];content=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="Kanalinformation ${esc(c[0])}"><div class="sheet-head"><span>KANALINFORMATION · MOCKBIBLIOTEK</span>${close}</div><div class="detail-content"><div class="detail-art">${art(valid&&state.epgMode!=='no-art'?c[3]:'identity')}</div><div class="detail-copy"><span class="tag">${esc(c[0])} · designkanal</span><h2>${esc(valid?c[1]:c[0])}</h2><p>${esc(valid?'Nu · '+c[1]+' · Nästa '+c[2]:state.epgMode==='stale'?'Guiden är föråldrad. Aktuellt program kan inte bekräftas.':'Programinformation saknas.')}</p><p class="notice">Syntetisk program- och källinformation. Ingen verklig ström ansluts.</p><div class="actions">${button('channel-play','primary',playIcon+'Se kanalen',()=>play({title:c[0],kind:c[3],meta:'Simulerad kanal · vald källa '+(state.quality||'Auto')}))}${button('channel-source','secondary','Källa: '+(state.quality||'Auto'),()=>{state.quality=({'Auto':'HD','HD':'FHD','FHD':'4K','4K':'Auto'})[state.quality||'Auto'];renderModal();focus('channel-source');toast('Mockkällor · inga verkliga kvalitetsalternativ verifierade');})}</div></div></div></section></div>`;modalRows=[{section:'kanal tillbaka',ids:['modal-back']},{section:'kanalåtgärder',ids:['channel-play','channel-source']}];}
else if(top.kind==='manual'){content=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="Manuellt kanalval"><div class="sheet-head"><span>MANUELLT KANALVAL</span>${close}</div><h2 class="manual-title">Vilken kanal vill du öppna?</h2><p class="notice">Matchens kanal är inte verifierad. Ett manuellt val bekräftar inte att matchen sänds där.</p><div class="row five manual-grid">${hockeyIndexes().map(i=>hockey('manual-ch'+i,i)).join('')||'<p class="notice">Inga kanaler i det valda biblioteket. Inget kanalval kan erbjudas.</p>'}</div><p class="library-footer">Alla kanaler här är lokala designfixturer. Inga IPTV-länkar eller strömmar används.</p></section></div>`;modalRows=[{section:'kanalval tillbaka',ids:['modal-back']}];if(hockeyIndexes().length)modalRows.push({section:'manuellt kanalval',ids:hockeyIndexes().map(i=>'manual-ch'+i)});}
else if(top.kind==='catalog'){const data=item.group?series:movies;content=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${item.group?'Serier':'Filmer'}"><div class="sheet-head"><span>DIN SAMLING</span>${close}</div><h1>${item.group?'Serier':'Filmer'}</h1><div class="row three catalog-grid">${data.map((x,i)=>vodCard(x,'catalog-'+i)).join('')}</div><p class="library-footer">Öppna en titel med OK. Tillbaka återställer samma ingång i Film & serier.</p></section></div>`;modalRows=[{section:'samling tillbaka',ids:['modal-back']},{section:'titlar',ids:[0,1,2].map(i=>'catalog-'+i)}];}
else {const canWatch=item.match&&verified()&&!item.unverified&&item.title===matchData().title;const primaryAction=item.match?(canWatch?()=>play({...item,meta:'Verifierad demokanal · TV Hockey'}):()=>manual()):()=>play(item);const label=item.match?(canWatch?'Se matchen · TV Hockey':'Välj kanal manuellt'):'Spela';content=`<div class="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="Information om ${esc(item.title)}"><div class="sheet-head"><span>${item.match?'MATCHINFORMATION':'FILM & SERIER'}</span>${close}</div><div class="detail-content"><div class="detail-art">${art(item.kind)}</div><div class="detail-copy"><span class="tag">${item.match?'Syntetisk matchfixtur':'Original designfixtur'}</span><h2>${esc(item.title)}</h2><p>${esc(item.meta||'En berättelse att stanna kvar i.')}</p>${item.match?`<p class="notice">${canWatch?'Verifierad TV-kanal finns i detta demoscenario. Uppspelningen är simulerad.':'Ingen matchsändning är verifierad. Du kan välja en demokanal manuellt.'}</p>`:'<p>En stilla början, en oväntad vändning. Exempeltitel och egen illustration för designgranskning.</p>'}<div class="actions">${button('detail-play','primary',playIcon+label,primaryAction)}</div></div></div></section></div>`;modalRows=[{section:'information tillbaka',ids:['modal-back']},{section:'titelåtgärd',ids:['detail-play']}];}
modal.innerHTML=content;}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function debug(){const row=currentRows().find(r=>r.ids.includes(state.focus));$('debug').hidden=!state.overlay;$('debug').textContent=`Sida: ${navs[state.page]} · Sektion: ${row?.section||'—'}\nFokus: ${state.focus} · Läge: ${state.stack.at(-1)?.kind||'innehåll'}`;}
function fit(){const area=$('viewport'),capture=document.documentElement.classList.contains('capture'),width=area.clientWidth-(capture?0:36),height=area.clientHeight-(capture?0:24),scale=Math.min(width/1920,height/1080);$('frame').style.width=1920*scale+'px';$('frame').style.height=1080*scale+'px';$('tv').style.transform=`scale(${scale})`;}
$('tv').addEventListener('focusin',event=>{const el=event.target.closest('[data-tv]');if(el&&el.dataset.tv!==state.focus)focus(el.dataset.tv);});
$('tv').addEventListener('click',event=>{const el=event.target.closest('[data-tv]');if(!el)return;focus(el.dataset.tv);actions[el.dataset.tv]?.();});
document.addEventListener('keydown',event=>{if(event.target.closest('#lab,#scenarios-panel'))return;if(event.key.startsWith('Arrow')){event.preventDefault();move(event.key);}else if(event.key==='Enter'){event.preventDefault();if(!event.repeat)actions[state.focus]?.();}else if(event.key==='Escape'||event.key==='Backspace'){event.preventDefault();if(!event.repeat)back();}else if(event.key==='Tab'&&state.stack.length){event.preventDefault();const ids=currentRows().flatMap(r=>r.ids),i=ids.indexOf(state.focus),next=(i+(event.shiftKey?-1:1)+ids.length)%ids.length;focus(ids[next]);}});
function scenarioChange(){const previous=state.focus;state.epgMode=$('epg').value;state.scenario=$('scenario').value;state.epg=!['no','stale'].includes($('epg').value);state.resume=$('resume').value==='yes';state.stack=[];render(previous);}
$('scenario').value=state.scenario;$('epg').value=state.epg?'yes':'no';$('resume').value=state.resume?'yes':'no';
['scenario','epg','resume'].forEach(id=>$(id).addEventListener('change',scenarioChange));$('overlay').addEventListener('change',()=>{state.overlay=$('overlay').checked;debug();});$('returnTv').onclick=()=>focus(state.focus,false);window.addEventListener('resize',fit);state.focus='';render();
</script><script src="source-adapter.js?v=3"></script><script src="iteration4.js?v=4"></script></body></html>
