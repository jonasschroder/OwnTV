name: Min TV prototype

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Prototype artifacts only. No tag trigger, release publication or signing secrets.
permissions:
  contents: read

concurrency:
  group: mintv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare pinned Core source
        run: bash tools/prepare-core.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testStandardDebugUnitTest :OwnTV_Core:core:testDebugUnitTest :OwnTV_Core:player-core:testDebugUnitTest --stacktrace
      - name: Lint
        if: always()
        run: ./gradlew :app:lintStandardDebug --stacktrace
      - name: Assemble ARM debug APK and device tests
        run: ./gradlew :app:assembleStandardDebug :app:assembleStandardDebugAndroidTest --stacktrace
      - name: Verify and stage Min TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          python3 tools/verify-mintv-apk.py --apk "$APK" --aapt2 "$TOOLS/aapt2"
          "$TOOLS/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/MinTV-v0.1-arm-debug.apk
          cd dist
          sha256sum MinTV-v0.1-arm-debug.apk > SHA256SUMS
      - name: Upload installable prototype
        uses: actions/upload-artifact@v7
        with:
          name: MinTV-v0.1-arm-debug
          path: |
            dist/MinTV-v0.1-arm-debug.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mintv-check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            .gradle-cache/OwnTV_Core/core/build/reports/tests/**
            .gradle-cache/OwnTV_Core/player-core/build/reports/tests/**
          include-hidden-files: true
          if-no-files-found: warn
